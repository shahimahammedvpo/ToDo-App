<h2>My Todo Tasks</h2>

<a routerLink="/add">+ Add New Task</a>

<hr />

@if (todoService.tasks().length === 0) {
  <p>No tasks available. Add your first task!</p>
}

@for (task of todoService.tasks(); track task.id) {
  <div>
    <h3>{{ task.title }}</h3>

    <p>{{ task.description || 'No description' }}</p>

    <label>
      <input
        type="checkbox"
        [checked]="task.completed"
        (change)="toggleTask(task.id, $any($event.target).checked)"
      />
      Completed
    </label>

    <p>Status: {{ task.completed ? 'Done' : 'Pending' }}</p>

    <a [routerLink]="['/tasks', task.id]">View / Edit</a>

    <button (click)="deleteTask(task.id)">Delete</button>

    <hr />
  </div>
}
